# Local orchestration: the API (which also serves the built React UI) plus an
# optional Redis cache. Bring up Redis with: `docker-compose --profile cache up`.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override the host-local default so the container reaches the redis service
      # when it is running (`--profile cache`). Redis is optional — the app falls
      # back to the in-memory cache if it is unreachable — so there is no hard
      # `depends_on: redis`, which would otherwise break the default (no-profile)
      # `docker-compose up` by referencing a service the active profile excludes.
      REDIS_URL: redis://redis:6379/0

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    ports:
      - "6379:6379"
