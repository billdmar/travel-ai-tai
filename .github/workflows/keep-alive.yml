name: Keep Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch: {}

# This job only curls a public URL; it needs no repo access at all.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake Render service
        run: |
          curl -sf --max-time 60 https://travel-ai-tai.onrender.com/health || true
